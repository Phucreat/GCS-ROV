# Cấu hình mavlink-router cho BlueOS
# =====================================
# File này copy vào Pi tại:
#   /etc/mavlink-router/main.conf
#
# Hoặc cấu hình qua BlueOS Web UI:
#   http://blueos.local → MAVLink Endpoints
#
# Kiến trúc luồng dữ liệu:
#
#  [ESP32/Pixhawk]             [BlueOS Pi]              [GCS Windows]
#   UART 115200   ──Serial──►  mavlink-router  ──UDP──►  :14550
#                              (C++ native,     ◄──UDP──  GCS commands
#                               ~50µs latency)
#                                    │
#                                    ├──UDP──► :14551  (SLAM container)
#                                    └──TCP──► :5760   (MAVProxy/debug)
#
# mavlink-router TU DONG:
#   - Forward ALL packets giữa các endpoints
#   - Handle sequence numbers
#   - Không cần code Python bridge nữa

[General]
TcpServerPort       = 5760     # MAVProxy / debug tools kết nối vào đây
ReportStats         = false
MavlinkDialect      = ardupilotmega
# Thời gian timeout endpoint (ms) — 0 = không timeout
MinHeartbeatTimeout = 0

# ─────────────────────────────────────────
# SERIAL ENDPOINT — ESP32 (hoặc Pixhawk STM32F7 sau này)
# ─────────────────────────────────────────
# Nếu kết nối qua USB cable:   Device=/dev/ttyUSB0
# Nếu kết nối qua GPIO UART:   Device=/dev/ttyAMA0
# (Pi 5 GPIO UART: TX=pin8/GPIO14, RX=pin10/GPIO15)
[UartEndpoint ESP32]
Device = /dev/ttyUSB0
Baud   = 115200

# ─────────────────────────────────────────
# GCS ENDPOINT — Windows PC chạy GCS
# ─────────────────────────────────────────
# Mode=Normal: mavlink-router CHỦ ĐỘNG gửi đến địa chỉ này
# Đổi Address thành IP máy tính GCS
[UdpEndpoint GCS]
Mode    = Normal
Address = 192.168.2.1      # <-- ĐỔI THÀNH IP MÁY GCS CỦA BẠN
Port    = 14550

# ─────────────────────────────────────────
# GCS LISTEN — Nhận kết nối từ bất kỳ IP nào (fallback)
# ─────────────────────────────────────────
# Mode=Server: mavlink-router lắng nghe, GCS kết nối vào
# Hữu ích khi IP GCS thay đổi (dùng laptop qua hotspot)
[UdpEndpoint GCS_Server]
Mode = Server
Port = 14550

# ─────────────────────────────────────────
# SLAM CONTAINER — Docker Visual SLAM nhận MAVLink
# ─────────────────────────────────────────
# SLAM cần dữ liệu ATTITUDE để fuse với camera
[UdpEndpoint SLAM]
Mode    = Normal
Address = 127.0.0.1        # localhost (Docker container trên cùng Pi)
Port    = 14551

# ─────────────────────────────────────────
# ONBOARD COMPANION — Các script Python trên Pi
# ─────────────────────────────────────────
# VD: script ghi log, health monitor, etc.
[UdpEndpoint Companion]
Mode    = Normal
Address = 127.0.0.1
Port    = 14552
