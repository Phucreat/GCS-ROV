name: Build Cross-Platform Release (Windows, Linux, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. BUILD WINDOWS INSTALLER (.EXE)
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Windows EXE
        run: |
          python -m PyInstaller GCS_ROV.spec --noconfirm

      - name: Package with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setup_CNC_NExora_GCS_Windows
          path: Output/Setup_CNC_NExora_GCS_*.exe

  # ───────────────────────────────────────────────────────────────────────────
  # 2. BUILD LINUX PACKAGE (AppImage / Standalone)
  # ───────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (AppImage / Standalone)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-cursor0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary with PyInstaller
        run: |
          pyinstaller --onedir --windowed --name=GCS_ROV \
            --icon=GUI/img/iconapp.ico \
            --add-data "GUI:GUI" \
            --add-data "AI:AI" \
            --add-data "assets:assets" \
            --add-data "core:core" \
            --add-data "database:database" \
            --add-data "network:network" \
            --add-data "utils:utils" \
            --add-data "3DC.obj:." \
            --add-data "3DC.mtl:." \
            --add-data "6DC.obj:." \
            --add-data "6DC.mtl:." \
            --add-data "yolov8n.pt:." \
            --add-data "LICENSE.txt:." \
            main.py

      - name: Compress Linux Package
        run: |
          tar -czvf Output_Linux_GCS_ROV.tar.gz -C dist GCS_ROV

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCS_ROV_Linux_x86_64
          path: Output_Linux_GCS_ROV.tar.gz

  # ───────────────────────────────────────────────────────────────────────────
  # 3. BUILD MACOS APPLICATION BUNDLE (.DMG / .APP)
  # ───────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App Bundle
        run: |
          pyinstaller --windowed --name="CNC_NExora_GCS" \
            --icon=GUI/img/iconapp.ico \
            --add-data "GUI:GUI" \
            --add-data "AI:AI" \
            --add-data "assets:assets" \
            --add-data "core:core" \
            --add-data "database:database" \
            --add-data "network:network" \
            --add-data "utils:utils" \
            --add-data "3DC.obj:." \
            --add-data "3DC.mtl:." \
            --add-data "6DC.obj:." \
            --add-data "6DC.mtl:." \
            --add-data "yolov8n.pt:." \
            --add-data "LICENSE.txt:." \
            main.py

      - name: Compress macOS App
        run: |
          cd dist && zip -r ../GCS_ROV_macOS.zip CNC_NExora_GCS.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCS_ROV_macOS
          path: GCS_ROV_macOS.zip
